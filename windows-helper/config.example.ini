; Windows MFLAC helper configuration.
;
; Copy to config.ini and edit.  The enrollment secret is deliberately NOT stored
; here: set it in the environment so it does not sit in a plain file.
;
;     setx HELPER_ENROLLMENT_SECRET "the-secret-from-the-server-.env"
;
; Paths may be written literally with backslashes and may use %VARS%.

[helper]

; Base URL of the converter API.  Use the public HTTPS origin in production.
api_base_url = https://api.yssqi.ccwu.cc

; Where the device credentials and the in-flight job journal are kept.
; Both files are DPAPI-protected on Windows.
state_dir = %LOCALAPPDATA%\WeChatPlayerHelper

; Display name shown in the server's helper device list.
device_name = %COMPUTERNAME%-helper

; How often to poll for work, and how often to send a device heartbeat.
poll_interval_seconds = 5
heartbeat_seconds = 60

; Lease renewal during a decode.  0 derives it from the server lease (lease / 3).
lease_heartbeat_seconds = 0

; Local deadline for one decode before reporting a timeout.
job_timeout_seconds = 1800

; ---------------------------------------------------------------------------
; Authorized key source
; ---------------------------------------------------------------------------
; none               - only files with an embedded EKey decode.  PC MusicEx
;                      jobs fail with a diagnosable reason.  This is the safe
;                      default and never guesses a key.
; ekey_file          - read one operator-supplied EKey from key_source_path.
; player_process_db  - read keys from an exported Android player_process_db.
;
; The helper only ever uses a key you are authorized to use, keeps it in memory
; for a single decode, and never writes it to disk or a log.
key_source = none

; Required when key_source is ekey_file or player_process_db.
; Point this at YOUR authorized source; it is never copied or uploaded.
; key_source_path = %LOCALAPPDATA%\WeChatPlayerHelper\authorized.ekey
; key_source_path = %LOCALAPPDATA%\WeChatPlayerHelper\player_process_db

; ---------------------------------------------------------------------------
; Host guards
; ---------------------------------------------------------------------------
; Do not claim work unless this process is running (empty disables the check).
; Example: QQMusic.exe
required_process =

; Refuse work below this much free space in the work directory.
min_free_disk_bytes = 536870912

; ---------------------------------------------------------------------------
; Transport and logging
; ---------------------------------------------------------------------------
verify_tls = yes
request_timeout_seconds = 60
download_timeout_seconds = 900
upload_timeout_seconds = 900
request_retries = 3
retry_backoff_seconds = 2.0

log_level = INFO

; Override only if qmc_mflac.py is not at ../mflac-linux-decoder/.
; decoder_path = C:\WeChatPlayerHelper\qmc_mflac.py
