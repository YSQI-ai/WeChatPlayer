name: CI

# Run on every push to main and on every pull request, so the tests report on
# the change rather than on someone remembering to run them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server-tests:
    name: Server protocol tests (36)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            converter-api/requirements.txt
            converter-api/requirements-dev.txt

      - name: Install dependencies
        # requirements-dev.txt, not requirements.txt: the protocol suite imports
        # fastapi.testclient, which is built on httpx and is not part of the
        # runtime dependencies.
        run: pip install -r converter-api/requirements-dev.txt

      - name: Helper-protocol tests
        # The tests import app.main, which needs a writable conversion root.
        # Point it at the runner's temp dir instead of the production path.
        working-directory: converter-api
        env:
          CONVERTER_TMP_ROOT: ${{ runner.temp }}/wechat-converter
        run: python -m unittest discover -s tests -p "test_helper_protocol.py" -v

  helper-tests:
    name: Windows helper unit tests (42)
    # These run on Windows because the helper is a Windows program.  It gates
    # work on a running process by shelling out to tasklist, and keeps its
    # credential file in DPAPI; neither exists on Linux.  On Linux the gate
    # fails open, so test_required_process_gate_can_block_work saw the job
    # claimed instead of blocked -- a pass on Windows and a failure there.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Helper unit tests
        # These import only helper.* and the standard library, so they need no
        # extra installation.
        working-directory: windows-helper
        shell: pwsh
        run: |
          $output = python -m unittest discover -s tests -p "test_helper_units.py" -v 2>&1 | Out-String
          $code = $LASTEXITCODE
          Write-Host $output

          if ($code -ne 0) {
            # The raw log needs a logged-in session to read, but annotations are
            # readable from the API -- which is how the earlier flake here had
            # to be chased.  Put the failing test into one.
            $detail = ($output -split "`n" | Select-String -Pattern '^(FAIL|ERROR):' -Context 0,15) -join "`n"
            if (-not $detail) {
              $detail = ($output -split "`n" | Select-Object -Last 40) -join "`n"
            }
            $escaped = $detail -replace '%', '%25' -replace "`r", '' -replace "`n", '%0A'
            Write-Host "::error title=Helper tests failed::$escaped"
            exit 1
          }

  miniprogram-tests:
    name: Mini program flow tests (13)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Flow tests
        # Stubs the wx runtime and uses only Node built-ins, so there is nothing
        # to install.
        run: node tools/miniprogram-flow.test.js

  docker-build:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./converter-api
          push: false
          load: true
          tags: wechat-converter-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Start the image and wait for health
        # A build that succeeds but produces a container that never serves is
        # still a broken image, so check that it actually answers.
        run: |
          docker run -d --name api -p 18080:18080 wechat-converter-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18080/api/v1/health; then
              echo
              echo "health endpoint answered after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "health check never succeeded; container logs follow"
          docker logs api
          exit 1

      - name: Show image size
        if: always()
        run: docker images wechat-converter-api:ci

      - name: Container logs on failure
        if: failure()
        run: docker logs api || true
